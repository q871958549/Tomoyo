name: Release Tomoyo WASM Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run unit tests & build release plugin.wasm
        run: |
          cargo test
          cargo build --target wasm32-unknown-unknown --release
          wasm=$(ls target/wasm32-unknown-unknown/release/*.wasm | head -n1)
          cp -f "$wasm" plugin.wasm
          ls -lh plugin.wasm

      - name: Package cross-platform Tomoyo plugin ZIP + SHA-256
        run: |
          tag="${GITHUB_REF_NAME:-v0.1.0}"
          mkdir -p dist/pkg
          cp tomoyo-plugin.toml plugin.wasm dist/pkg/
          [ -f icon.png ] && cp icon.png dist/pkg/
          (cd dist/pkg && zip -rq "../tomoyo-plugin-${tag}-wasm.zip" .)
          (cd dist && sha256sum "tomoyo-plugin-${tag}-wasm.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tomoyo-plugin-*-wasm.zip
            dist/SHA256SUMS.txt
