[package]
name = "tomoyo-everything"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Pure-Rust native WM_COPYDATA IPC client for Voidtools Everything 1.4 & 1.5a (zero external DLLs, built for Tomoyo Launcher)"
keywords = ["everything", "voidtools", "windows", "search", "ipc"]
categories = ["os", "filesystem", "api-bindings"]

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
