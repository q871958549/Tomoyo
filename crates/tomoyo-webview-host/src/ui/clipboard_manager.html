<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Tomoyo 剪贴板工作台</title>
  <style>
    @font-face {
      font-family: "Alibaba PuHuiTi 3.0";
      src: url("https://tomoyo-fonts.local/AlibabaPuHuiTi-3-55-Regular.ttf") format("truetype");
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: "Alibaba PuHuiTi 3.0";
      src: url("https://tomoyo-fonts.local/AlibabaPuHuiTi-3-65-Medium.ttf") format("truetype");
      font-weight: 500 700; font-style: normal;
    }
    :root {
      color-scheme: light;
      --bg: #f6f7fb; --panel: #ffffff; --border: #dfe4ef; --text: #111827; --muted: #525d70;
      --accent: #3b5bdb; --accent-fg: #ffffff; --pill: #eef1f7; --sel: #ebf0ff; --ok: #059669; --danger: #dc2626;
    }
    body.theme-dark {
      color-scheme: dark;
      --bg: #13141c; --panel: #1a1b26; --border: #2c2e40; --text: #f3f4f8; --muted: #9096ad;
      --accent: #7c83fd; --accent-fg: #ffffff; --pill: #26283a; --sel: #242844; --ok: #34d399; --danger: #f87171;
    }
    body.theme-midnight {
      color-scheme: dark;
      --bg: #0e101a; --panel: #141828; --border: #27304b; --text: #f1f5f9; --muted: #8b97b4;
      --accent: #6366f1; --accent-fg: #ffffff; --pill: #1f2640; --sel: #1d2648; --ok: #34d399; --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Alibaba PuHuiTi 3.0", "Microsoft YaHei UI", "Segoe UI", sans-serif; font-size: 13px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .h-left { display: flex; align-items: center; gap: 8px; }
    .h-title { font-weight: 600; font-size: 14.5px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--pill); color: var(--muted); font-size: 11px; font-weight: 500; }
    .h-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 10px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    .btn.danger { color: var(--danger); }
    .workspace { flex: 1; display: flex; min-height: 0; }
    .rail {
      width: 158px; background: var(--panel); border-right: 1px solid var(--border);
      padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
    }
    .rail-sec { font-size: 11px; color: var(--muted); padding: 8px 8px 4px; font-weight: 600; }
    .rail button {
      width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted);
      border-radius: 7px; padding: 6px 9px; font-family: inherit; font-size: 12.5px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .rail button:hover { background: var(--pill); color: var(--text); }
    .rail button.active { background: var(--accent); color: var(--accent-fg); }
    .list-col {
      width: 340px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--bg);
    }
    .search-box { padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .search-box input {
      width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px; font-family: inherit; font-size: 12.5px; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .list-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .item-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px;
      cursor: pointer; transition: border-color 0.1s;
    }
    .item-card:hover { border-color: var(--accent); }
    .item-card.selected { background: var(--sel); border-color: var(--accent); }
    .item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
    .item-prev { font-size: 12.5px; line-height: 1.4; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .item-thumb { width: 100%; max-height: 76px; object-fit: cover; border-radius: 6px; margin-top: 4px; border: 1px solid var(--border); }
    .detail-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
    .detail-head {
      padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .meta-form {
      display: grid; grid-template-columns: 180px 1fr; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .meta-form label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); }
    .meta-form input, .meta-form select {
      background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 8px; font-family: inherit; font-size: 12.5px; outline: none;
    }
    .meta-form input:focus { border-color: var(--accent); }
    .detail-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px; overflow: auto; }
    textarea.editor {
      flex: 1; width: 100%; min-height: 220px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      background: var(--bg); color: var(--text); font-family: "Alibaba PuHuiTi 3.0", Consolas, monospace; font-size: 13px; line-height: 1.6; outline: none; resize: none;
    }
    textarea.editor:focus { border-color: var(--accent); }
    .img-preview { max-width: 100%; max-height: 360px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); align-self: center; }
    .empty-detail { flex: 1; display: grid; place-items: center; color: var(--muted); }
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); place-items: center; z-index: 50;
    }
    .modal-bg.open { display: grid; }
    .modal {
      width: 520px; max-width: 92vw; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    footer {
      display: flex; align-items: center; justify-content: space-between; padding: 7px 14px;
      background: var(--panel); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
    }
    #toast { color: var(--ok); font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <div class="h-left">
      <span class="h-title">Tomoyo 剪贴板工作台</span>
      <span id="hdr-total" class="pill">0 条</span>
      <span id="hdr-cap" class="pill">采集中</span>
    </div>
    <div class="h-actions">
      <button class="btn" onclick="exportBackup()">导出 JSON 备份</button>
      <button class="btn" onclick="openImportModal()">导入 JSON</button>
      <button id="btn-clear" class="btn danger" onclick="clearUnpinned()">清空非置顶</button>
      <button class="btn" onclick="post({cmd:'toggle_pin_topmost'})">置顶窗口</button>
      <button class="btn" onclick="post({cmd:'close'})">关闭 (Esc)</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="rail">
      <div class="rail-sec">类型筛选</div>
      <div id="rail-types"></div>
      <div class="rail-sec">自定义标签</div>
      <div id="rail-tags"></div>
    </aside>

    <div class="list-col">
      <div class="search-box">
        <input id="q-input" type="text" placeholder="搜索内容、备注、来源应用或拼音..." oninput="onSearchInput()" />
      </div>
      <div id="list-scroll" class="list-scroll"></div>
    </div>

    <div class="detail-col">
      <div id="detail-empty" class="empty-detail">选择左侧剪贴板记录查看、编辑或标注标签</div>
      <div id="detail-wrap" style="display:none;flex:1;flex-direction:column;min-height:0">
        <div class="detail-head">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span id="d-kind" class="pill">-</span>
            <span id="d-src" class="pill">-</span>
            <span id="d-time" class="pill">-</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button id="btn-save" class="btn primary" onclick="saveDetail()">保存修改</button>
            <button class="btn" onclick="copyCurrent(false)">复制</button>
            <button id="btn-single" class="btn" onclick="copyCurrent(true)">单行复制</button>
            <button id="btn-pin" class="btn" onclick="togglePinCurrent()">置顶</button>
            <button class="btn danger" onclick="deleteCurrent()">删除</button>
          </div>
        </div>
        <div class="meta-form">
          <label>
            <span>分组标签（可选预设或输入）</span>
            <input id="d-tag" type="text" list="tag-presets" maxlength="24" placeholder="如：工作 / 代码 / 常用" />
            <datalist id="tag-presets"><option value="工作"></option><option value="代码"></option><option value="常用"></option><option value="资料"></option></datalist>
          </label>
          <label>
            <span>备注说明（可被搜索命中）</span>
            <input id="d-note" type="text" maxlength="160" placeholder="添加简短备注便于后续查找..." />
          </label>
        </div>
        <div class="detail-body">
          <textarea id="d-text" class="editor" spellcheck="false"></textarea>
          <img id="d-img" class="img-preview" style="display:none" alt="Clipboard Image" />
          <div id="d-img-bar" style="display:none;margin-top:10px;justify-content:center;gap:8px">
            <button class="btn" onclick="openCurrentImage()">用系统看图打开</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="import-modal" class="modal-bg">
    <div class="modal">
      <div style="font-weight:600">导入剪贴板 JSON 备份</div>
      <textarea id="import-json" class="editor" style="min-height:180px" placeholder="粘贴之前导出的 JSON 备份内容..."></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn" onclick="closeImportModal()">取消</button>
        <button class="btn primary" onclick="confirmImport()">确认导入</button>
      </div>
    </div>
  </div>

  <footer>
    <span id="toast">已加载本地 SQLite 剪贴板历史</span>
    <span>双击列表快速复制 · Ctrl+S 保存修改 · Esc 关闭并释放 100% WebView 内存</span>
  </footer>
  <script>
/*__CLIP_JS__*/
  </script>
</body>
</html>
