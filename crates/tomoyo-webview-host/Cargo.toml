[package]
name = "tomoyo-webview-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ephemeral on-demand WebView2 plugin host & Settings Center for Tomoyo (0 idle RAM)"

[[bin]]
name = "tomoyo-webview-host"
path = "src/main.rs"

[dependencies]
tomoyo-protocol = { workspace = true }
tomoyo-core = { workspace = true }
tomoyo-plugin-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2 = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
