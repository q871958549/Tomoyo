[package]
name = "tomoyo-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified multi-runtime plugin host for Tomoyo: Job-Object STDIO RPC, fuel-metered WASM sandbox, and on-demand WebView dispatch"

[dependencies]
tomoyo-protocol = { workspace = true }
tomoyo-core = { workspace = true }
wasmi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
