[package]
name = "tomoyo-plugin-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "On-demand zero-idle-RAM offline Windows WinRT OCR plugin for Tomoyo"

[[bin]]
name = "tomoyo-plugin-ocr"
path = "src/main.rs"

[dependencies]
tomoyo-sdk = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
