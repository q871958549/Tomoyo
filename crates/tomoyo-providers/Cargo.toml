[package]
name = "tomoyo-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Built-in zero-overhead providers for Tomoyo: Everything, Apps (incl. UWP), Calculator, SQLite Text+Image Clipboard, Process Killer, Web Search, Window Switcher, Super Match, and System/Update Diagnostics"

[dependencies]
tomoyo-protocol = { workspace = true }
tomoyo-core = { workspace = true }
tomoyo-everything = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
