id = "dev.tomoyo.example-hello"
name = "文本大小写转换示例 (Rust 原生)"
version = "0.1.0"
description = "基于 tomoyo-sdk 编写的 Rust 原生 STDIO 参考插件：即时完成大小写、蛇形/驼峰命名与反转转换"
author = "Tomoyo Contributors"
license = "MIT"

[runtime]
kind = "stdio_jsonrpc"
command = "tomoyo-plugin-hello"
args = []

[triggers]
keywords = ["hi", "case"]

[resources]
max_memory_mb = 32
idle_timeout_secs = 45
query_timeout_ms = 1000
