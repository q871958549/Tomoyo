id = "dev.tomoyo.notes"
name = "本地快速备忘录 (Quick Notes)"
version = "3.2.0"
description = "Protocol v3 混合架构本地优先备忘录：开放 .md + YAML Frontmatter 存储，支持 note/memo/bw 秒级检索、@pin/@todo/#标签过滤、[[双向链接]]、每日速记与独立工作台（0 常驻内存）"
author = "Tomoyo Contributors"
license = "MIT"
icon = "icon.png"
category = "docs"
display_mode = "window"
tags = ["notes", "markdown", "memo", "todo", "wiki", "local-first"]
permissions = ["filesystem_read", "filesystem_write"]

[runtime]
kind = "stdio_jsonrpc"
command = "tomoyo-plugin-notes"
args = []

[ui]
entry = "ui/index.html"
width = 1080
height = 680
utools_compat = false

[triggers]
keywords = ["note", "memo", "bw"]

[resources]
max_memory_mb = 48
idle_timeout_secs = 30
query_timeout_ms = 1200

[[hotkeys]]
id = "quick_note"
label = "快速呼出本地备忘录"
default_hotkey = ""
trigger_query = "note "

[[tray_actions]]
id = "open_workbench"
label = "本地备忘录工作台"
open_ui = true

[[text_actions]]
id = "save_selection_note"
label = "一键存为备忘"
match_kinds = ["text", "url", "json", "code", "path"]

[[settings]]
key = "notes_dir"
label = "自定义备忘录目录"
description = "留空则自动跟随本地同步目录或 %LOCALAPPDATA%\\Tomoyo\\notes"
type = "text"
placeholder = "例如 D:\\Docs\\Notes（留空使用默认目录）"
default = ""

[[settings]]
key = "max_results"
label = "单次最多展示条数"
description = "检索列表最多返回的备忘录条目数"
type = "number"
min = 5
max = 30
step = 5
default = 15

[[settings]]
key = "default_tag"
label = "新建默认标签"
description = "通过 note + 或 note clip 新建备忘录时自动追加的 #标签（留空则不追加）"
type = "text"
placeholder = "例如 #inbox 或 #work"
default = ""
