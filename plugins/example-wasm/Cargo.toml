[package]
name = "tomoyo-plugin-wasm-demo"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Reference capability-sandboxed Tomoyo WebAssembly plugin: JWT inspector & Byte-unit converter"

[lib]
crate-type = ["cdylib"]

[dependencies]
tomoyo-wasm-sdk = { path = "../../crates/tomoyo-wasm-sdk" }
base64 = "0.22"
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
panic = "abort"
