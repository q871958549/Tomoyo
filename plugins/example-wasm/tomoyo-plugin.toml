id = "dev.tomoyo.example-wasm"
name = "JWT 解析与存储单位换算 (WASM 沙箱)"
version = "0.2.0"
description = "零环境权限与指令燃料计量的 WebAssembly 沙箱插件：即时解码 JWT 令牌与换算 B/KB/MB/GB/TB 单位"
author = "Tomoyo Contributors"
license = "MIT"
icon = "icon.png"
category = "dev"

[runtime]
kind = "wasm"
module = "plugin.wasm"
max_fuel = 5000000

[triggers]
keywords = ["wasm", "jwt", "unit"]

[resources]
max_memory_mb = 16
idle_timeout_secs = 30
query_timeout_ms = 1000
