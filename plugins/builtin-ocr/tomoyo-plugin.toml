id = "dev.tomoyo.ocr"
name = "离线识图取字 (Windows WinRT OCR)"
version = "2.0.0"
description = "基于系统原生 WinRT OcrEngine 离线识别图片文字（支持自适应 2x 放大、中英文清理与原图对照审校，用完即销毁 0 常驻内存）"
author = "Tomoyo Contributors"
license = "MIT OR Apache-2.0"

[runtime]
kind = "stdio_jsonrpc"
command = "tomoyo-plugin-ocr"
args = []

[triggers]
keywords = ["ocr"]
clipboard_types = ["image"]

[resources]
max_memory_mb = 192
idle_timeout_secs = 15
query_timeout_ms = 8000

[[hotkeys]]
id = "quick_ocr"
label = "快速识别最近剪贴板截图"
default_hotkey = ""
trigger_query = "ocr "

[[settings]]
key = "default_lang"
label = "默认识别语言"
description = "未在命令后附加 zh/en 参数时的默认 OCR 语言策略"
type = "select"
default = "auto"
options = [
  { value = "auto", label = "自动检测（优先中英）" },
  { value = "zh", label = "简体中文优先" },
  { value = "en", label = "英文优先" }
]

[[settings]]
key = "raw_output"
label = "保留原始逐词空格"
description = "关闭时自动清理中文字间多余空格；开启时输出 WinRT 原始识别串"
type = "bool"
default = false
