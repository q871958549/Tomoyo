id = "dev.tomoyo.ocr"
name = "Offline Windows OCR (离线识图取字)"
version = "0.8.0"
description = "基于系统原生 WinRT OcrEngine 离线识别图片文字（支持中英文，用完即销毁 0 常驻内存）"
author = "Tomoyo Contributors"
license = "MIT OR Apache-2.0"

[runtime]
kind = "stdio_jsonrpc"
command = "tomoyo-plugin-ocr"
args = []

[triggers]
keywords = ["ocr"]
clipboard_types = ["image"]

[resources]
max_memory_mb = 128
idle_timeout_secs = 15
query_timeout_ms = 5000
