id = "dev.tomoyo.example-webview-json"
name = "JSON 格式化与树形检视器 (WebView)"
version = "0.2.0"
description = "基于按需 WebView 宿主与 window.utools / window.tomoyo 桥接的交互式 JSON 美化与树形检视工具（关闭即释放 0 常驻内存）"
author = "Tomoyo Contributors"
license = "MIT"
icon = "icon.png"
category = "dev"
display_mode = "inline"

[runtime]
kind = "webview"
entry = "index.html"
utools_compat = true
width = 920
height = 640

[triggers]
keywords = ["json", "utools"]

[resources]
max_memory_mb = 256
idle_timeout_secs = 5
