<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JSON Inspector — Tomoyo (uTools Bridge)</title>
  <style>
    :root {
      --bg: #f6f7fa;
      --surface: #ffffff;
      --border: #dde2ec;
      --text: #151822;
      --muted: #5f687a;
      --accent: #181c28;
      --ok: #059669;
      --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12131a;
        --surface: #1b1d28;
        --border: #2c3044;
        --text: #f3f4f8;
        --muted: #8e94aa;
        --accent: #f3f4f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
    .pill {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .toolbar { display: flex; gap: 8px; }
    button {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-weight: 500;
    }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    button:hover { opacity: 0.88; }
    main {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; min-height: 0;
    }
    textarea, pre {
      width: 100%; height: 100%; margin: 0; padding: 14px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: 13px; line-height: 1.5; resize: none; overflow: auto; outline: none;
    }
    footer {
      padding: 8px 18px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); background: var(--surface);
      display: flex; justify-content: space-between;
    }
    .status-ok { color: var(--ok); font-weight: 600; }
    .status-err { color: var(--err); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>JSON Inspector</span>
      <span class="pill">window.utools + window.tomoyo</span>
      <span class="pill">Ephemeral Host · 0 Idle RAM</span>
    </div>
    <div class="toolbar">
      <button onclick="formatJson(2)" class="primary">Format (2sp)</button>
      <button onclick="minifyJson()">Minify</button>
      <button onclick="copyOut()">Copy Output</button>
      <button onclick="saveHistory()">Save (utools.db)</button>
      <button onclick="closeHost()">Close (Esc)</button>
    </div>
  </header>
  <main>
    <textarea id="input" placeholder="Paste JSON here..."></textarea>
    <pre id="output"></pre>
  </main>
  <footer>
    <span id="status">Ready</span>
    <span id="dbinfo">utools.dbStorage ready</span>
  </footer>

  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const dbInfoEl = document.getElementById('dbinfo');

    const sample = JSON.stringify({
      product: "Tomoyo",
      architecture: "Rust Native + Everything IPC + WASM + Ephemeral WebView",
      utools_compat: true,
      idle_ram_mb: 0.1
    }, null, 2);

    function formatJson(indent = 2) {
      try {
        const parsed = JSON.parse(inputEl.value);
        outputEl.textContent = JSON.stringify(parsed, null, indent);
        statusEl.className = 'status-ok';
        statusEl.textContent = 'Valid JSON · ' + outputEl.textContent.length + ' chars';
      } catch (e) {
        statusEl.className = 'status-err';
        statusEl.textContent = 'Syntax Error: ' + e.message;
      }
    }

    function minifyJson() {
      try {
        const parsed = JSON.parse(inputEl.value);
        outputEl.textContent = JSON.stringify(parsed);
        statusEl.className = 'status-ok';
        statusEl.textContent = 'Minified · ' + outputEl.textContent.length + ' chars';
      } catch (e) {
        statusEl.className = 'status-err';
        statusEl.textContent = 'Syntax Error: ' + e.message;
      }
    }

    function copyOut() {
      const text = outputEl.textContent || inputEl.value;
      if (window.utools) {
        window.utools.copyText(text);
        statusEl.className = 'status-ok';
        statusEl.textContent = 'Copied via utools.copyText()!';
      }
    }

    function saveHistory() {
      if (window.utools) {
        window.utools.dbStorage.setItem('last_json', inputEl.value);
        dbInfoEl.textContent = 'Saved via utools.dbStorage @ ' + new Date().toLocaleTimeString();
      }
    }

    function closeHost() {
      if (window.utools) window.utools.outPlugin();
      else window.close();
    }

    inputEl.addEventListener('input', () => formatJson(2));

    if (window.utools) {
      window.utools.onPluginEnter((action) => {
        const saved = window.utools.dbStorage.getItem('last_json');
        inputEl.value = (action && action.payload && action.payload.trim()) || saved || sample;
        if (saved) dbInfoEl.textContent = 'Restored from utools.dbStorage';
        formatJson(2);
      });
    } else {
      inputEl.value = sample;
      formatJson(2);
    }
  </script>
</body>
</html>
