id = "dev.tomoyo.translate"
name = "多源对照翻译 (官方插件)"
version = "3.0.0"
description = "多引擎并行划词与对照翻译插件（Google / MyMemory + 有道词典 / DeepL / OpenAI 兼容 / 本地 Ollama）：独立进程零后台常驻、DPAPI/系统密钥环加密凭据、生词本与历史记录"
author = "Tomoyo Contributors"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/q871958549/Tomoyo"
icon = "icon.png"
category = "productivity"
display_mode = "window"
tags = ["translate", "dictionary", "deepl", "openai", "ollama", "wordbook"]
permissions = ["network", "clipboard", "selection_read"]
events = ["hotkey_triggered"]

[runtime]
kind = "stdio_jsonrpc"
command = "tomoyo-plugin-translate"
args = []

[ui]
entry = "ui/index.html"
width = 780
height = 620
utools_compat = false

[triggers]
keywords = ["tr", "fy"]

[resources]
max_memory_mb = 64
idle_timeout_secs = 30
query_timeout_ms = 20000

[[hotkeys]]
id = "selection_translate"
label = "全局划词翻译"
default_hotkey = "Alt+T"
capture_selection = true

[[tray_actions]]
id = "open_translator"
label = "多源翻译"
open_ui = true

[[settings]]
key = "target_lang"
label = "默认目标语言"
description = "选择 auto 时自动识别中英互译（中文→English，英文→简体中文）"
section = "翻译引擎与语言"
type = "select"
default = "auto"
options = [
  { value = "auto", label = "Auto (中 ⇄ 英)" },
  { value = "zh-Hans", label = "简体中文" },
  { value = "en", label = "English" },
  { value = "ja", label = "日本語" },
  { value = "ko", label = "한국어" },
  { value = "fr", label = "Français" },
  { value = "de", label = "Deutsch" },
]

[[settings]]
key = "engine_google"
label = "Google 翻译（免费）"
description = "并行启用 Google 翻译引擎"
section = "翻译引擎与语言"
type = "bool"
default = true

[[settings]]
key = "engine_mymemory"
label = "MyMemory + 有道词典（免费）"
description = "并行启用 MyMemory 翻译，并在查询英文单词时自动附带音标与词典释义"
section = "翻译引擎与语言"
type = "bool"
default = true

[[settings]]
key = "engine_deepl"
label = "DeepL API（需密钥）"
description = "支持 DeepL Free (:fx) 与 Pro API 密钥"
section = "翻译引擎与语言"
type = "bool"
default = false

[[settings]]
key = "engine_openai"
label = "OpenAI 兼容接口（需密钥）"
description = "支持 OpenAI / DeepSeek / 通义千问等 Chat Completions 兼容接口"
section = "翻译引擎与语言"
type = "bool"
default = false

[[settings]]
key = "engine_ollama"
label = "本地 Ollama 离线大模型"
description = "通过本机 Ollama HTTP 接口完成 100% 离线翻译"
section = "翻译引擎与语言"
type = "bool"
default = false

[[settings]]
key = "deepl_api_key"
label = "DeepL API Key"
description = "通过系统级加密凭据库保存（不写入明文配置）"
section = "API 密钥与自定义端点"
type = "secret"
placeholder = "输入 DeepL Free (:fx) 或 Pro Key"

[[settings]]
key = "openai_api_key"
label = "OpenAI 兼容接口 Key"
description = "通过系统级加密凭据库保存（不写入明文配置）"
section = "API 密钥与自定义端点"
type = "secret"
placeholder = "输入 OpenAI / DeepSeek / 通义千问 API Key"

[[settings]]
key = "openai_base_url"
label = "OpenAI 兼容 Base URL"
description = "默认 https://api.openai.com/v1"
section = "API 密钥与自定义端点"
type = "text"
placeholder = "https://api.openai.com/v1"
default = "https://api.openai.com/v1"

[[settings]]
key = "openai_model"
label = "OpenAI 兼容模型名称"
description = "例如 gpt-4o-mini / deepseek-chat"
section = "API 密钥与自定义端点"
type = "text"
placeholder = "gpt-4o-mini"
default = "gpt-4o-mini"

[[settings]]
key = "ollama_url"
label = "本地 Ollama 地址"
description = "默认 http://127.0.0.1:11434"
section = "API 密钥与自定义端点"
type = "text"
placeholder = "http://127.0.0.1:11434"
default = "http://127.0.0.1:11434"

[[settings]]
key = "ollama_model"
label = "本地 Ollama 模型名称"
description = "例如 qwen2.5:7b / llama3.2"
section = "API 密钥与自定义端点"
type = "text"
placeholder = "qwen2.5:7b"
default = "qwen2.5:7b"
