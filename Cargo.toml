[workspace]
resolver = "2"
members = [
    "crates/tomoyo-protocol",
    "crates/tomoyo-everything",
    "crates/tomoyo-core",
    "crates/tomoyo-providers",
    "crates/tomoyo-plugin-host",
    "crates/tomoyo-sdk",
    "crates/tomoyo-wasm-sdk",
    "crates/tomoyo-webview-host",
    "crates/tomoyo-cli",
    "crates/tomoyo-app",
    "crates/tomoyo-capture",
    "crates/tomoyo-plugin-ocr",
    "crates/tomoyo-ui-shared",
    "crates/tomoyo-ui-macos",
    "crates/tomoyo-ui-linux",
    "plugins/example-hello",
    "plugins/official-capture",
    "plugins/official-md-editor",
    "plugins/official-notes",
    "plugins/official-translate",
]
exclude = [
    "plugins/example-wasm",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q871958549/Tomoyo"
homepage = "https://q871958549.github.io/Tomoyo/"
readme = "README.md"

[workspace.dependencies]
tomoyo-protocol = { path = "crates/tomoyo-protocol", version = "3.0.0" }
tomoyo-everything = { path = "crates/tomoyo-everything", version = "3.0.0" }
tomoyo-core = { path = "crates/tomoyo-core", version = "3.0.0" }
tomoyo-providers = { path = "crates/tomoyo-providers", version = "3.0.0" }
tomoyo-plugin-host = { path = "crates/tomoyo-plugin-host", version = "3.0.0" }
tomoyo-sdk = { path = "crates/tomoyo-sdk", version = "3.0.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
lru = "0.16"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
mimalloc = { version = "0.1", default-features = false }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "wat", "auto-dispatch"] }
sha2 = "0.11"
png = "0.18"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
webview2-com = "0.39"
winresource = "0.1"
windows = "0.62"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
