<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340">
  <defs>
    <linearGradient id="bgPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#F1F3F8"/>
    </linearGradient>
    <linearGradient id="porcelainBg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6F7FA"/>
      <stop offset="100%" stop-color="#E7EBF2"/>
    </linearGradient>
    <linearGradient id="obsidianInk" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2A2F3D"/>
      <stop offset="50%" stop-color="#151822"/>
      <stop offset="100%" stop-color="#0C0E16"/>
    </linearGradient>
    <radialGradient id="pearlDot" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#D6E0EE"/>
      <stop offset="100%" stop-color="#96A6BF"/>
    </radialGradient>
    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141824" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1120" height="340" rx="28" fill="url(#bgPlate)"/>

  <!-- Left Modern White App Icon -->
  <g transform="translate(88, 66) scale(0.41)">
    <rect x="40" y="36" width="432" height="432" rx="112" fill="url(#porcelainBg)"
          stroke="#DCE1EC" stroke-width="6" filter="url(#softDrop)"/>
    <path d="M 134 214 C 150 172, 198 164, 258 164 C 308 164, 348 158, 384 134
             C 368 172, 326 196, 266 202 C 210 208, 166 202, 134 214 Z"
          fill="url(#obsidianInk)"/>
    <path d="M 278 202 C 242 232, 224 282, 232 344 C 236 370, 252 384, 272 382
             C 282 381, 286 376, 282 368 C 264 332, 260 278, 286 218
             C 290 208, 286 200, 278 202 Z"
          fill="url(#obsidianInk)"/>
    <circle cx="322" cy="236" r="14" fill="url(#pearlDot)" stroke="#E4EAF3" stroke-width="1.5"/>
  </g>

  <!-- Artistic Calligraphic "Tomoyo" Wordmark -->
  <g fill="url(#obsidianInk)">
    <!-- Sculptural Capital T matching icon -->
    <path d="M 342 138 C 358 108, 398 104, 444 104 C 482 104, 512 98, 536 80
             C 524 108, 492 124, 448 128 C 406 132, 370 128, 342 138 Z"/>
    <path d="M 454 128 C 424 150, 412 184, 418 224 C 421 242, 434 252, 448 250
             C 455 249, 458 245, 455 240 C 442 216, 440 178, 460 138 Z"/>

    <!-- Refined Editorial Lettering "omoyo" -->
    <text x="468" y="246"
          font-family="'Georgia', 'Palatino Linotype', 'Times New Roman', serif"
          font-size="146" font-weight="400" letter-spacing="4" fill="url(#obsidianInk)">omoyo</text>

    <!-- Subtle Artistic Tail Flourish on final 'o' -->
    <path d="M 946 164 C 966 154, 984 152, 998 142 C 988 158, 972 168, 950 172 Z"
          fill="url(#obsidianInk)" opacity="0.92"/>
  </g>

  <!-- Minimalist Hairline Subtitle -->
  <text x="414" y="286"
        font-family="'Segoe UI Variable', 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="300" letter-spacing="8" fill="#5A6275">OPEN RUST LAUNCHER</text>
</svg>
