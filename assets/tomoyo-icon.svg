<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="porcelainBg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6F7FA"/>
      <stop offset="100%" stop-color="#E9ECF2"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD2DF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="obsidianInk" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2A2F3D"/>
      <stop offset="45%" stop-color="#171A24"/>
      <stop offset="100%" stop-color="#0E1018"/>
    </linearGradient>
    <radialGradient id="pearlDot" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D6E0EE"/>
      <stop offset="100%" stop-color="#9BAAC2"/>
    </radialGradient>
    <filter id="tileShadow" x="-15%" y="-12%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#141824" flood-opacity="0.14"/>
    </filter>
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D1018" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Modern White Porcelain Squircle -->
  <rect x="40" y="36" width="432" height="432" rx="112" ry="112"
        fill="url(#porcelainBg)" stroke="url(#rimStroke)" stroke-width="5"
        filter="url(#tileShadow)"/>

  <!-- Inner Specular Bevel -->
  <rect x="52" y="48" width="408" height="408" rx="102" ry="102"
        fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>

  <!-- Sculptural Calligraphic "T" Monogram -->
  <g filter="url(#inkShadow)">
    <!-- Sweeping Asymmetric Blade Crossbar -->
    <path d="M 134 214
             C 150 172, 198 164, 258 164
             C 308 164, 348 158, 384 134
             C 368 172, 326 196, 266 202
             C 210 208, 166 202, 134 214 Z"
          fill="url(#obsidianInk)"/>
    <!-- Fluid Sculpted Vertical Stem -->
    <path d="M 278 202
             C 242 232, 224 282, 232 344
             C 236 370, 252 384, 272 382
             C 282 381, 286 376, 282 368
             C 264 332, 260 278, 286 218
             C 290 208, 286 200, 278 202 Z"
          fill="url(#obsidianInk)"/>
  </g>

  <!-- Iridescent Silver-Ice Pearl Accent Dot -->
  <circle cx="322" cy="236" r="14" fill="url(#pearlDot)" stroke="#E4EAF3" stroke-width="1.5"/>
</svg>
