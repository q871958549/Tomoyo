name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "llms.txt"
      - "llms-full.txt"
      - "README.md"
      - "README_ZH.md"
      - "assets/tomoyo-wordmark.png"
      - "assets/tomoyo-icon.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site artifact
        run: |
          mkdir -p _site/assets
          cp -r site/* _site/
          cp llms.txt llms-full.txt README.md README_ZH.md _site/
          cp assets/tomoyo-wordmark.png assets/tomoyo-icon.png assets/tomoyo-icon.svg _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
