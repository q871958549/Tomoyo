name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native Linux build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libcurl4-openssl-dev libsecret-1-dev libx11-dev libxext-dev libxtst-dev libdbus-1-dev libwayland-dev libpipewire-0.3-dev \
            tesseract-ocr tesseract-ocr-eng

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Setup Rust toolchain (Linux + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugins (example + official DevTools)
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp -f plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm
          cargo build --manifest-path plugins/official-devtools-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp -f plugins/official-devtools-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_devtools.wasm plugins/official-devtools-wasm/plugin.wasm

      - name: Test, build & verify Linux release binaries
        run: |
          cargo test --workspace
          cargo build --release --workspace
          node scripts/check_hygiene.mjs --check-binaries
          ./target/release/tomoyo --self-test --strict-budget
          ./target/release/tomoyo-webview-host --self-test
          ./target/release/tomoyo-capture --self-test
          ./target/release/tomoyo-plugin-ocr --self-test
          ./target/release/tomoyo-plugin-translate --self-test
          ./target/release/tomoyo-plugin-capture --self-test
          ./target/release/tomoyo-plugin-clipboard --self-test

      - name: Stage Linux Suite, Core & standalone plugin bundles + SHA-256
        run: |
          tag="${GITHUB_REF_NAME:-}"
          case "$tag" in v*) ;; *) tag="v3.0.0" ;; esac
          stage="dist/stage-linux"
          core_stage="dist/stage-linux-core"
          rm -rf "$stage" "$core_stage" dist/plugins
          mkdir -p "$stage/assets/fonts" "$stage/assets/plugin-icons" "$stage/registry" "$stage/packaging/linux" "$stage/scripts" dist/plugins
          mkdir -p "$core_stage/assets/fonts" "$core_stage/assets/plugin-icons" "$core_stage/registry" "$core_stage/packaging/linux" "$core_stage/scripts"

          for bin in tomoyo tomoyo-webview-host tomoyo-capture tomoyo-cli tomoyo-plugin-hello tomoyo-plugin-ocr tomoyo-plugin-notes tomoyo-plugin-md-editor tomoyo-plugin-translate tomoyo-plugin-capture tomoyo-plugin-clipboard; do
            install -Dm755 "target/release/$bin" "$stage/$bin"
          done
          for bin in tomoyo tomoyo-webview-host tomoyo-cli; do
            install -Dm755 "target/release/$bin" "$core_stage/$bin"
          done
          for target_dir in "$stage" "$core_stage"; do
            install -Dm644 LICENSE-MIT LICENSE-APACHE README.md "$target_dir/"
            install -Dm644 assets/fonts/*.ttf "$target_dir/assets/fonts/"
            install -Dm644 assets/plugin-icons/*.png "$target_dir/assets/plugin-icons/"
            install -Dm644 assets/tomoyo-icon.png assets/tomoyo-icon.svg "$target_dir/assets/"
            install -Dm644 registry/index.json "$target_dir/registry/index.json"
            if [ -d registry/shards ]; then
              mkdir -p "$target_dir/registry/shards"
              install -Dm644 registry/shards/*.json "$target_dir/registry/shards/"
            fi
            install -Dm644 packaging/linux/tomoyo.desktop packaging/linux/PKGBUILD "$target_dir/packaging/linux/"
            install -Dm755 scripts/install-local.sh scripts/uninstall-local.sh "$target_dir/scripts/"
          done

          for p in example-hello example-python example-wasm example-webview-json builtin-ocr official-notes official-md-editor official-translate official-capture official-clipboard official-devtools-wasm; do
            mkdir -p "$stage/plugins/$p"
            cp -a "plugins/$p/." "$stage/plugins/$p/"
            rm -rf "$stage/plugins/$p/target" "$stage/plugins/$p/__pycache__"
          done

          pack_plugin() {
            local slug="$1" dir="$2" bin="$3" extra="${4:-}"
            local ps="dist/stage-plugin-$slug"
            local out="$PWD/dist/plugins/tomoyo-plugin-${slug}-${tag}-linux-x86_64.zip"
            rm -rf "$ps" "$out" && mkdir -p "$ps"
            install -Dm644 "plugins/$dir/tomoyo-plugin.toml" "$ps/tomoyo-plugin.toml"
            [ -f "plugins/$dir/icon.png" ] && install -Dm644 "plugins/$dir/icon.png" "$ps/icon.png"
            [ -d "plugins/$dir/ui" ] && cp -a "plugins/$dir/ui" "$ps/ui"
            install -Dm755 "target/release/$bin" "$ps/$bin"
            [ -n "$extra" ] && install -Dm755 "target/release/$extra" "$ps/$extra"
            (cd "$ps" && zip -rq "$out" .)
          }
          pack_plugin ocr builtin-ocr tomoyo-plugin-ocr
          pack_plugin notes official-notes tomoyo-plugin-notes
          pack_plugin md-editor official-md-editor tomoyo-plugin-md-editor
          pack_plugin translate official-translate tomoyo-plugin-translate
          pack_plugin capture official-capture tomoyo-plugin-capture tomoyo-capture
          pack_plugin clipboard official-clipboard tomoyo-plugin-clipboard

          tgz="dist/Tomoyo-${tag}-linux-x86_64.tar.gz"
          core_tgz="dist/Tomoyo-${tag}-linux-x86_64-core.tar.gz"
          tar -C "$stage" -czf "$tgz" .
          tar -C "$core_stage" -czf "$core_tgz" .
          (cd dist && sha256sum "$(basename "$tgz")" "$(basename "$core_tgz")" > SHA256SUMS-linux.txt)
          (cd dist/plugins && sha256sum tomoyo-plugin-*-linux-x86_64.zip > ../SHA256SUMS-plugins-linux.txt)
          cat dist/SHA256SUMS-linux.txt
          cat dist/SHA256SUMS-plugins-linux.txt

      - name: Attest Linux Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Tomoyo-*-linux-x86_64.tar.gz
            dist/Tomoyo-*-linux-x86_64-core.tar.gz
            dist/plugins/tomoyo-plugin-*-linux-x86_64.zip
            dist/SHA256SUMS-linux.txt
            dist/SHA256SUMS-plugins-linux.txt

      - name: Publish GitHub Release (Linux x86_64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Tomoyo ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/Tomoyo-*-linux-x86_64.tar.gz
            dist/Tomoyo-*-linux-x86_64-core.tar.gz
            dist/plugins/tomoyo-plugin-*-linux-x86_64.zip
            dist/SHA256SUMS-linux.txt
            dist/SHA256SUMS-plugins-linux.txt
            packaging/linux/PKGBUILD

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Enforce coding standards & anti-bloat hygiene gate
        shell: pwsh
        run: pwsh -File scripts/check_hygiene.ps1

      - name: Setup Rust toolchain (Windows + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugins (example + official DevTools)
        shell: pwsh
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm -Force
          cargo build --manifest-path plugins/official-devtools-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/official-devtools-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_devtools.wasm plugins/official-devtools-wasm/plugin.wasm -Force

      - name: Test & build release binaries
        run: |
          cargo test --workspace
          cargo build --release --workspace

      - name: Stage Windows x64 Suite & Core bundles, sign (optional) & build Inno Setup
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v3.0.0" }
          $ver = $tag.TrimStart("v")
          $stage = "dist/stage"
          $coreStage = "dist/stage-core"
          Remove-Item -Recurse -Force $stage, $coreStage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage, "$stage/assets/fonts", "$stage/assets/plugin-icons", "$stage/registry" | Out-Null
          New-Item -ItemType Directory -Force -Path $coreStage, "$coreStage/assets/fonts", "$coreStage/assets/plugin-icons", "$coreStage/registry" | Out-Null

          foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-capture.exe", "tomoyo-cli.exe", "tomoyo-plugin-hello.exe", "tomoyo-plugin-ocr.exe", "tomoyo-plugin-notes.exe", "tomoyo-plugin-md-editor.exe", "tomoyo-plugin-translate.exe", "tomoyo-plugin-capture.exe", "tomoyo-plugin-clipboard.exe")) {
            Copy-Item "target/release/$bin" "$stage/"
          }

          $pfxPath = $null
          $signtool = $null
          if ($env:WINDOWS_CERT_PFX_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue)?.Source
            if (-not $signtool) {
              $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $signtool) { throw "Authenticode secrets configured but signtool.exe was not found." }
            $pfxPath = Join-Path ([System.IO.Path]::GetTempPath()) "tomoyo-signing-$PID.pfx"
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          } else {
            Write-Host "[INFO] WINDOWS_CERT_PFX_BASE64/PASSWORD not set; skipping Authenticode signing (SHA256 + SLSA remain active)."
          }

          try {
            if ($pfxPath) {
              Get-ChildItem "$stage/*.exe" | ForEach-Object {
                & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $_.FullName
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }

            foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-cli.exe")) {
              Copy-Item "$stage/$bin" "$coreStage/"
            }
            foreach ($dir in @($stage, $coreStage)) {
              Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "$dir/"
              Copy-Item assets/fonts/*.ttf "$dir/assets/fonts/"
              Copy-Item assets/plugin-icons/*.png "$dir/assets/plugin-icons/"
              Copy-Item assets/tomoyo.ico "$dir/assets/"
              Copy-Item registry/index.json "$dir/registry/"
              if (Test-Path registry/shards) {
                New-Item -ItemType Directory -Force -Path "$dir/registry/shards" | Out-Null
                Copy-Item registry/shards/*.json "$dir/registry/shards/" -Force
              }
            }

            foreach ($p in @("example-hello", "example-python", "example-wasm", "example-webview-json", "builtin-ocr", "official-notes", "official-md-editor", "official-translate", "official-capture", "official-clipboard", "official-devtools-wasm")) {
              New-Item -ItemType Directory -Force -Path "$stage/plugins/$p" | Out-Null
              Get-ChildItem "plugins/$p" -Exclude "target","__pycache__" | Copy-Item -Destination "$stage/plugins/$p" -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path "dist/plugins" | Out-Null
            $pluginSpecs = @(
              @{ Slug = "ocr"; Dir = "builtin-ocr"; Bins = @("tomoyo-plugin-ocr.exe") },
              @{ Slug = "notes"; Dir = "official-notes"; Bins = @("tomoyo-plugin-notes.exe") },
              @{ Slug = "md-editor"; Dir = "official-md-editor"; Bins = @("tomoyo-plugin-md-editor.exe") },
              @{ Slug = "translate"; Dir = "official-translate"; Bins = @("tomoyo-plugin-translate.exe") },
              @{ Slug = "capture"; Dir = "official-capture"; Bins = @("tomoyo-plugin-capture.exe", "tomoyo-capture.exe") },
              @{ Slug = "clipboard"; Dir = "official-clipboard"; Bins = @("tomoyo-plugin-clipboard.exe") }
            )
            $pluginZips = @()
            foreach ($spec in $pluginSpecs) {
              $ps = "dist/stage-plugin-$($spec.Slug)"
              Remove-Item -Recurse -Force $ps -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $ps | Out-Null
              Copy-Item "plugins/$($spec.Dir)/tomoyo-plugin.toml" "$ps/"
              if (Test-Path "plugins/$($spec.Dir)/icon.png") { Copy-Item "plugins/$($spec.Dir)/icon.png" "$ps/" }
              if (Test-Path "plugins/$($spec.Dir)/ui") { Copy-Item "plugins/$($spec.Dir)/ui" "$ps/ui" -Recurse -Force }
              foreach ($b in $spec.Bins) { Copy-Item "$stage/$b" "$ps/" }
              $pz = "dist/plugins/tomoyo-plugin-$($spec.Slug)-$tag-windows-x86_64.zip"
              Compress-Archive -Path "$ps/*" -DestinationPath $pz -Force
              $pluginZips += $pz
            }

            $zipPath = "dist/Tomoyo-$tag-windows-x64-portable.zip"
            $coreZipPath = "dist/Tomoyo-$tag-windows-x64-core-portable.zip"
            Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
            Compress-Archive -Path "$coreStage/*" -DestinationPath $coreZipPath -Force

            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
            }
            & $iscc "/DAppVersion=$ver" "/DStageDir=..\dist\stage" "packaging\tomoyo.iss"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $setupPath = "dist/Tomoyo-$tag-windows-x64-setup.exe"
            if ($pfxPath) {
              & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $setupPath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            if ($pfxPath -and (Test-Path $pfxPath)) { Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue }
          }

          $lines = @()
          $setupSha = ""
          $zipSha = ""
          foreach ($art in @($setupPath, $zipPath, $coreZipPath)) {
            $h = (Get-FileHash $art -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Leaf $art
            $lines += "$h  $name"
            if ($art -eq $setupPath) { $setupSha = $h.ToUpper() }
            if ($art -eq $zipPath) { $zipSha = $h }
          }
          $lines | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"
          $pLines = @()
          foreach ($pz in $pluginZips) {
            $h = (Get-FileHash $pz -Algorithm SHA256).Hash.ToLower()
            $pLines += "$h  $(Split-Path -Leaf $pz)"
          }
          $pLines | Out-File -Encoding ascii "dist/SHA256SUMS-plugins-windows.txt"
          Get-Content "dist/SHA256SUMS-plugins-windows.txt"

          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          node scripts/sync-release-manifests.mjs --version "$ver" --setup-sha256 "$setupSha" --zip-sha256 "$zipSha" --release-date "$releaseDate" --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest x64 Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Tomoyo-*-windows-x64-setup.exe
            dist/Tomoyo-*-windows-x64-portable.zip
            dist/Tomoyo-*-windows-x64-core-portable.zip
            dist/plugins/tomoyo-plugin-*-windows-x86_64.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS-plugins-windows.txt

      - name: Attach Windows x64 Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tomoyo-*-windows-x64-setup.exe
            dist/Tomoyo-*-windows-x64-portable.zip
            dist/Tomoyo-*-windows-x64-core-portable.zip
            dist/plugins/tomoyo-plugin-*-windows-x86_64.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS-plugins-windows.txt
            dist/tomoyo.scoop.json
            dist/TomoyoContributors.Tomoyo.yaml
            dist/TomoyoContributors.Tomoyo.installer.yaml
            dist/TomoyoContributors.Tomoyo.locale.en-US.yaml
            dist/TomoyoContributors.Tomoyo.locale.zh-CN.yaml

  build-windows-arm64:
    runs-on: windows-11-arm
    needs: [build-linux-x86_64, build-windows-x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain (Windows ARM64)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build native Windows ARM64 release binaries
        run: cargo build --release --workspace

      - name: Package Windows ARM64 Portable ZIP & SHA-256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v3.0.0" }
          $stage = "dist/stage-arm64"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/assets/fonts", "$stage/assets/plugin-icons", "$stage/registry" | Out-Null
          foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-capture.exe", "tomoyo-cli.exe", "tomoyo-plugin-hello.exe", "tomoyo-plugin-ocr.exe", "tomoyo-plugin-notes.exe", "tomoyo-plugin-md-editor.exe", "tomoyo-plugin-translate.exe", "tomoyo-plugin-capture.exe", "tomoyo-plugin-clipboard.exe")) {
            Copy-Item "target/release/$bin" "$stage/"
          }
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "$stage/"
          Copy-Item assets/fonts/*.ttf "$stage/assets/fonts/"
          Copy-Item assets/plugin-icons/*.png "$stage/assets/plugin-icons/"
          Copy-Item assets/tomoyo.ico "$stage/assets/"
          Copy-Item registry/index.json "$stage/registry/"
          if (Test-Path registry/shards) {
            New-Item -ItemType Directory -Force -Path "$stage/registry/shards" | Out-Null
            Copy-Item registry/shards/*.json "$stage/registry/shards/" -Force
          }
          foreach ($p in @("example-hello", "example-python", "example-wasm", "example-webview-json", "builtin-ocr", "official-notes", "official-md-editor", "official-translate", "official-capture", "official-clipboard")) {
            New-Item -ItemType Directory -Force -Path "$stage/plugins/$p" | Out-Null
            Get-ChildItem "plugins/$p" -Exclude "target","__pycache__" | Copy-Item -Destination "$stage/plugins/$p" -Recurse -Force
          }
          $zipPath = "dist/Tomoyo-$tag-windows-arm64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          $h = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$h  $(Split-Path -Leaf $zipPath)" | Out-File -Encoding ascii "dist/SHA256SUMS-arm64.txt"
          Get-Content "dist/SHA256SUMS-arm64.txt"

      - name: Attest ARM64 Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Tomoyo-*-windows-arm64-portable.zip
            dist/SHA256SUMS-arm64.txt

      - name: Attach Windows ARM64 Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tomoyo-*-windows-arm64-portable.zip
            dist/SHA256SUMS-arm64.txt
