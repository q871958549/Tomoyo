name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Enforce coding standards & anti-bloat hygiene gate
        shell: pwsh
        run: pwsh -File scripts/check_hygiene.ps1

      - name: Setup Rust toolchain (Windows + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build example WASM plugin
        shell: pwsh
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm -Force

      - name: Test & build release binaries
        run: |
          cargo test --workspace
          cargo build --release --workspace

      - name: Stage release bundle, build Inno Setup installer & portable ZIP
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v2.2.0" }
          $ver = $tag.TrimStart("v")
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/assets/fonts", "$stage/registry" | Out-Null

          foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-capture.exe", "tomoyo-cli.exe", "tomoyo-plugin-hello.exe", "tomoyo-plugin-ocr.exe", "tomoyo-plugin-notes.exe")) {
            Copy-Item "target/release/$bin" "$stage/"
          }
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "$stage/"
          Copy-Item assets/fonts/*.ttf "$stage/assets/fonts/"
          Copy-Item assets/tomoyo.ico "$stage/assets/"
          Copy-Item registry/index.json "$stage/registry/"

          foreach ($p in @("example-hello", "example-python", "example-wasm", "example-webview-json", "builtin-ocr", "official-notes")) {
            New-Item -ItemType Directory -Force -Path "$stage/plugins/$p" | Out-Null
            Get-ChildItem "plugins/$p" -Exclude "target","__pycache__" | Copy-Item -Destination "$stage/plugins/$p" -Recurse -Force
          }

          # 1. Portable ZIP (x64)
          $zipPath = "dist/Tomoyo-$tag-windows-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          # 2. Native Windows Installer (.exe via Inno Setup 6)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" "/DStageDir=..\dist\stage" "packaging\tomoyo.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 3. SHA-256 Checksums + Winget/Scoop release manifests (preserving ManifestVersion 1.6.0)
          $setupPath = "dist/Tomoyo-$tag-windows-x64-setup.exe"
          $lines = @()
          $setupSha = ""
          $zipSha = ""
          foreach ($art in @($setupPath, $zipPath)) {
            $h = (Get-FileHash $art -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Leaf $art
            $lines += "$h  $name"
            if ($art -eq $setupPath) { $setupSha = $h.ToUpper() }
            if ($art -eq $zipPath) { $zipSha = $h }
          }
          $lines | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

          $scoopOut = (Get-Content "packaging/scoop/tomoyo.json" -Raw) `
            -replace 'PLACEHOLDER_UPDATED_BY_RELEASE_SHA256SUMS', $zipSha `
            -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" `
            -replace '/releases/download/v[^/]+/Tomoyo-v[^-]+-', "/releases/download/v$ver/Tomoyo-v$ver-"
          Set-Content -Path "dist/tomoyo.scoop.json" -Value $scoopOut -Encoding UTF8

          $wingetOut = (Get-Content "packaging/winget/TomoyoContributors.Tomoyo.installer.yaml" -Raw) `
            -replace 'PLACEHOLDER_UPDATED_BY_RELEASE_SHA256SUMS', $setupSha `
            -replace '(?m)^PackageVersion:\s*.+$', "PackageVersion: $ver" `
            -replace '/releases/download/v[^/]+/Tomoyo-v[^-]+-', "/releases/download/v$ver/Tomoyo-v$ver-"
          Set-Content -Path "dist/TomoyoContributors.Tomoyo.installer.yaml" -Value $wingetOut -Encoding UTF8

      - name: Attest x64 Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Tomoyo-*-windows-x64-setup.exe
            dist/Tomoyo-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (x64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Tomoyo ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/Tomoyo-*-windows-x64-setup.exe
            dist/Tomoyo-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/tomoyo.scoop.json
            dist/TomoyoContributors.Tomoyo.installer.yaml

  build-windows-arm64:
    runs-on: windows-11-arm
    needs: [build-windows-x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (Windows ARM64)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build native Windows ARM64 release binaries
        run: cargo build --release --workspace

      - name: Package Windows ARM64 Portable ZIP & SHA-256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v2.2.0" }
          $stage = "dist/stage-arm64"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/assets/fonts", "$stage/registry" | Out-Null
          foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-capture.exe", "tomoyo-cli.exe", "tomoyo-plugin-hello.exe", "tomoyo-plugin-ocr.exe", "tomoyo-plugin-notes.exe")) {
            Copy-Item "target/release/$bin" "$stage/"
          }
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "$stage/"
          Copy-Item assets/fonts/*.ttf "$stage/assets/fonts/"
          Copy-Item assets/tomoyo.ico "$stage/assets/"
          Copy-Item registry/index.json "$stage/registry/"
          foreach ($p in @("example-hello", "example-python", "example-wasm", "example-webview-json", "builtin-ocr", "official-notes")) {
            New-Item -ItemType Directory -Force -Path "$stage/plugins/$p" | Out-Null
            Get-ChildItem "plugins/$p" -Exclude "target","__pycache__" | Copy-Item -Destination "$stage/plugins/$p" -Recurse -Force
          }
          $zipPath = "dist/Tomoyo-$tag-windows-arm64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          $h = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$h  $(Split-Path -Leaf $zipPath)" | Out-File -Encoding ascii "dist/SHA256SUMS-arm64.txt"
          Get-Content "dist/SHA256SUMS-arm64.txt"

      - name: Attest ARM64 Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Tomoyo-*-windows-arm64-portable.zip
            dist/SHA256SUMS-arm64.txt

      - name: Attach Windows ARM64 Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tomoyo-*-windows-arm64-portable.zip
            dist/SHA256SUMS-arm64.txt
