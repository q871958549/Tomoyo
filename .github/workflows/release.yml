name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native Linux build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libcurl4-openssl-dev libsecret-1-dev libx11-dev libxext-dev libxtst-dev libdbus-1-dev libwayland-dev libpipewire-0.3-dev \
            tesseract-ocr tesseract-ocr-eng

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Setup Rust toolchain (Linux + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build example WASM plugin
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp -f plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm

      - name: Test, build & verify Linux release binaries
        run: |
          cargo test --workspace
          cargo build --release --workspace
          node scripts/check_hygiene.mjs --check-binaries
          ./target/release/tomoyo --self-test --strict-budget
          ./target/release/tomoyo-webview-host --self-test
          ./target/release/tomoyo-capture --self-test
          ./target/release/tomoyo-plugin-ocr --self-test

      - name: Stage Linux tarball & SHA-256 checksum
        run: |
          tag="${GITHUB_REF_NAME:-}"
          case "$tag" in v*) ;; *) tag="v2.4.0" ;; esac
          stage="dist/stage-linux"
          rm -rf "$stage"
          mkdir -p "$stage/assets/fonts" "$stage/registry" "$stage/packaging/linux" "$stage/scripts"

          for bin in tomoyo tomoyo-webview-host tomoyo-capture tomoyo-cli tomoyo-plugin-hello tomoyo-plugin-ocr tomoyo-plugin-notes; do
            install -Dm755 "target/release/$bin" "$stage/$bin"
          done
          install -Dm644 LICENSE-MIT LICENSE-APACHE README.md "$stage/"
          install -Dm644 assets/fonts/*.ttf "$stage/assets/fonts/"
          install -Dm644 assets/tomoyo-icon.png assets/tomoyo-icon.svg "$stage/assets/"
          install -Dm644 registry/index.json "$stage/registry/index.json"
          install -Dm644 packaging/linux/tomoyo.desktop packaging/linux/PKGBUILD "$stage/packaging/linux/"
          install -Dm755 scripts/install-local.sh scripts/uninstall-local.sh "$stage/scripts/"

          for p in example-hello example-python example-wasm example-webview-json builtin-ocr official-notes; do
            mkdir -p "$stage/plugins/$p"
            cp -a "plugins/$p/." "$stage/plugins/$p/"
            rm -rf "$stage/plugins/$p/target" "$stage/plugins/$p/__pycache__"
          done

          tgz="dist/Tomoyo-${tag}-linux-x86_64.tar.gz"
          tar -C "$stage" -czf "$tgz" .
          (cd dist && sha256sum "$(basename "$tgz")" > SHA256SUMS-linux.txt)
          cat dist/SHA256SUMS-linux.txt

      - name: Attest Linux Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Tomoyo-*-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt

      - name: Publish GitHub Release (Linux x86_64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Tomoyo ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/Tomoyo-*-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
            packaging/linux/PKGBUILD

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Enforce coding standards & anti-bloat hygiene gate
        shell: pwsh
        run: pwsh -File scripts/check_hygiene.ps1

      - name: Setup Rust toolchain (Windows + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build example WASM plugin
        shell: pwsh
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm -Force

      - name: Test & build release binaries
        run: |
          cargo test --workspace
          cargo build --release --workspace

      - name: Stage release bundle, build Inno Setup installer & portable ZIP
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v2.4.0" }
          $ver = $tag.TrimStart("v")
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/assets/fonts", "$stage/registry" | Out-Null

          foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-capture.exe", "tomoyo-cli.exe", "tomoyo-plugin-hello.exe", "tomoyo-plugin-ocr.exe", "tomoyo-plugin-notes.exe")) {
            Copy-Item "target/release/$bin" "$stage/"
          }
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "$stage/"
          Copy-Item assets/fonts/*.ttf "$stage/assets/fonts/"
          Copy-Item assets/tomoyo.ico "$stage/assets/"
          Copy-Item registry/index.json "$stage/registry/"

          foreach ($p in @("example-hello", "example-python", "example-wasm", "example-webview-json", "builtin-ocr", "official-notes")) {
            New-Item -ItemType Directory -Force -Path "$stage/plugins/$p" | Out-Null
            Get-ChildItem "plugins/$p" -Exclude "target","__pycache__" | Copy-Item -Destination "$stage/plugins/$p" -Recurse -Force
          }

          $zipPath = "dist/Tomoyo-$tag-windows-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" "/DStageDir=..\dist\stage" "packaging\tomoyo.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setupPath = "dist/Tomoyo-$tag-windows-x64-setup.exe"
          $lines = @()
          $setupSha = ""
          $zipSha = ""
          foreach ($art in @($setupPath, $zipPath)) {
            $h = (Get-FileHash $art -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Leaf $art
            $lines += "$h  $name"
            if ($art -eq $setupPath) { $setupSha = $h.ToUpper() }
            if ($art -eq $zipPath) { $zipSha = $h }
          }
          $lines | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")

          $scoopOut = (Get-Content "packaging/scoop/tomoyo.json" -Raw) `
            -replace 'PLACEHOLDER_UPDATED_BY_RELEASE_SHA256SUMS', $zipSha `
            -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" `
            -replace '/releases/download/v[^/]+/Tomoyo-v[^-]+-', "/releases/download/v$ver/Tomoyo-v$ver-"
          Set-Content -Path "dist/tomoyo.scoop.json" -Value $scoopOut -Encoding UTF8

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $distAbs = (Resolve-Path "dist").Path
          foreach ($mf in @(
            "TomoyoContributors.Tomoyo.yaml",
            "TomoyoContributors.Tomoyo.installer.yaml",
            "TomoyoContributors.Tomoyo.locale.en-US.yaml",
            "TomoyoContributors.Tomoyo.locale.zh-CN.yaml"
          )) {
            $wingetOut = (Get-Content "packaging/winget/$mf" -Raw) `
              -replace 'PLACEHOLDER_UPDATED_BY_RELEASE_SHA256SUMS', $setupSha `
              -replace '(?m)^PackageVersion:\s*.+$', "PackageVersion: $ver" `
              -replace '(?m)^ReleaseDate:\s*.+$', "ReleaseDate: $releaseDate" `
              -replace '(?m)^(\s*-\s*DisplayName:\s*Tomoyo v).+$', "`${1}$ver" `
              -replace '/releases/download/v[^/]+/Tomoyo-v[^-]+-', "/releases/download/v$ver/Tomoyo-v$ver-" `
              -replace '/releases/tag/v[^\s]+', "/releases/tag/v$ver" `
              -replace '/blob/v[^/]+/LICENSE-MIT', "/blob/v$ver/LICENSE-MIT"
            $wingetOut = ($wingetOut -replace "`r`n", "`n") -replace "`n", "`r`n"
            [System.IO.File]::WriteAllText((Join-Path $distAbs $mf), $wingetOut, $utf8NoBom)
          }

      - name: Attest x64 Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Tomoyo-*-windows-x64-setup.exe
            dist/Tomoyo-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt

      - name: Attach Windows x64 Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tomoyo-*-windows-x64-setup.exe
            dist/Tomoyo-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/tomoyo.scoop.json
            dist/TomoyoContributors.Tomoyo.yaml
            dist/TomoyoContributors.Tomoyo.installer.yaml
            dist/TomoyoContributors.Tomoyo.locale.en-US.yaml
            dist/TomoyoContributors.Tomoyo.locale.zh-CN.yaml

  build-windows-arm64:
    runs-on: windows-11-arm
    needs: [build-linux-x86_64, build-windows-x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain (Windows ARM64)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build native Windows ARM64 release binaries
        run: cargo build --release --workspace

      - name: Package Windows ARM64 Portable ZIP & SHA-256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v2.4.0" }
          $stage = "dist/stage-arm64"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/assets/fonts", "$stage/registry" | Out-Null
          foreach ($bin in @("tomoyo.exe", "tomoyo-webview-host.exe", "tomoyo-capture.exe", "tomoyo-cli.exe", "tomoyo-plugin-hello.exe", "tomoyo-plugin-ocr.exe", "tomoyo-plugin-notes.exe")) {
            Copy-Item "target/release/$bin" "$stage/"
          }
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "$stage/"
          Copy-Item assets/fonts/*.ttf "$stage/assets/fonts/"
          Copy-Item assets/tomoyo.ico "$stage/assets/"
          Copy-Item registry/index.json "$stage/registry/"
          foreach ($p in @("example-hello", "example-python", "example-wasm", "example-webview-json", "builtin-ocr", "official-notes")) {
            New-Item -ItemType Directory -Force -Path "$stage/plugins/$p" | Out-Null
            Get-ChildItem "plugins/$p" -Exclude "target","__pycache__" | Copy-Item -Destination "$stage/plugins/$p" -Recurse -Force
          }
          $zipPath = "dist/Tomoyo-$tag-windows-arm64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          $h = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$h  $(Split-Path -Leaf $zipPath)" | Out-File -Encoding ascii "dist/SHA256SUMS-arm64.txt"
          Get-Content "dist/SHA256SUMS-arm64.txt"

      - name: Attest ARM64 Release Build Provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Tomoyo-*-windows-arm64-portable.zip
            dist/SHA256SUMS-arm64.txt

      - name: Attach Windows ARM64 Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tomoyo-*-windows-arm64-portable.zip
            dist/SHA256SUMS-arm64.txt
