name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Enforce coding standards & anti-bloat hygiene gate
        shell: pwsh
        run: pwsh -File scripts/check_hygiene.ps1

      - name: Setup Rust toolchain (Windows + wasm32 + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build example WASM plugin
        shell: pwsh
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm -Force

      - name: Run Clippy lint gate (zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace unit & integration tests (zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Enforce release binary size ceilings
        shell: pwsh
        run: pwsh -File scripts/check_hygiene.ps1 -CheckBinaries

      - name: Run strict anti-leak resource budget & WebView self-tests
        shell: pwsh
        run: |
          $out1 = Join-Path $env:TEMP "tomoyo_ci_st1.txt"
          $out2 = Join-Path $env:TEMP "tomoyo_ci_st2.txt"
          $p1 = Start-Process -FilePath ".\target\release\tomoyo.exe" -ArgumentList "--self-test","--strict-budget" -Wait -PassThru -RedirectStandardOutput $out1 -NoNewWindow
          Get-Content $out1
          if ($p1.ExitCode -ne 0) { exit $p1.ExitCode }
          $p2 = Start-Process -FilePath ".\target\release\tomoyo-webview-host.exe" -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $out2 -NoNewWindow
          Get-Content $out2
          if ($p2.ExitCode -ne 0) { exit $p2.ExitCode }
          $out3 = Join-Path $env:TEMP "tomoyo_ci_st3.txt"
          $p3 = Start-Process -FilePath ".\target\release\tomoyo-capture.exe" -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $out3 -NoNewWindow
          Get-Content $out3
          if ($p3.ExitCode -ne 0) { exit $p3.ExitCode }
          .\target\release\tomoyo-plugin-ocr.exe --self-test
          .\target\release\tomoyo-cli.exe registry list
          .\target\release\tomoyo-cli.exe registry check --manifest-only
          .\target\release\tomoyo-cli.exe dev plugins/official-notes --query "hello" --once

  cross-platform-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test core & cross-platform UI adapters
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo test -p tomoyo-protocol -p tomoyo-core -p tomoyo-everything -p tomoyo-providers -p tomoyo-ui-shared -p tomoyo-ui-macos -p tomoyo-ui-linux

  windows-arm64-check:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust toolchain (Windows ARM64)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Verify full workspace builds natively on Windows ARM64
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check --workspace
          cargo test -p tomoyo-protocol -p tomoyo-core
