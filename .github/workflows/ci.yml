name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-test:
    name: Linux Primary Gate (CachyOS/Arch/Ubuntu GTK3 + WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config desktop-file-utils \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libcurl4-openssl-dev libsecret-1-dev libx11-dev libxext-dev libxtst-dev libdbus-1-dev libwayland-dev libpipewire-0.3-dev \
            tesseract-ocr tesseract-ocr-eng

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Enforce coding standards, anti-bloat & desktop file hygiene
        run: |
          node scripts/check_hygiene.mjs
          desktop-file-validate packaging/linux/tomoyo.desktop

      - name: Setup Rust toolchain (Linux + wasm32 + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugins (example + official DevTools)
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp -f plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm
          cargo build --manifest-path plugins/official-devtools-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp -f plugins/official-devtools-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_devtools.wasm plugins/official-devtools-wasm/plugin.wasm
          cargo test --manifest-path plugins/official-devtools-wasm/Cargo.toml
          cargo build --manifest-path plugins/official-regex-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp -f plugins/official-regex-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_regex.wasm plugins/official-regex-wasm/plugin.wasm
          cargo test --manifest-path plugins/official-regex-wasm/Cargo.toml

      - name: Run Clippy lint gate (zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace unit & integration tests (zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Enforce release binary size ceilings
        run: node scripts/check_hygiene.mjs --check-binaries

      - name: Run strict anti-leak resource budget & subsystem self-tests
        run: |
          ./target/release/tomoyo --self-test --strict-budget
          ./target/release/tomoyo-webview-host --self-test
          ./target/release/tomoyo-capture --self-test
          ./target/release/tomoyo-plugin-ocr --self-test
          ./target/release/tomoyo-plugin-translate --self-test
          ./target/release/tomoyo-plugin-capture --self-test
          ./target/release/tomoyo-plugin-clipboard --self-test
          ./target/release/tomoyo-plugin-winlayout --self-test
          ./target/release/tomoyo-plugin-ai --self-test
          ./target/release/tomoyo-cli registry list
          ./target/release/tomoyo-cli registry check --manifest-only
          ./target/release/tomoyo-cli dev plugins/official-notes --query "hello" --once
          ./target/release/tomoyo-cli dev plugins/official-md-editor --query "" --once
          ./target/release/tomoyo-cli dev plugins/official-translate --query "hello" --once
          ./target/release/tomoyo-cli dev plugins/official-capture --query "" --once
          ./target/release/tomoyo-cli dev plugins/official-clipboard --query ":manage" --once
          ./target/release/tomoyo-cli dev plugins/official-devtools-wasm --query "cron 0 9 * * 1-5" --once
          ./target/release/tomoyo-cli dev plugins/official-regex-wasm --query "/(\\w+)@([\\w.]+)/ alice@example.com" --once
          ./target/release/tomoyo-cli dev plugins/official-winlayout --query "left" --once
          ./target/release/tomoyo-cli dev plugins/official-ai --query "sum hello" --once
          ./target/release/tomoyo-cli verify plugins/official-ai
          ./target/release/tomoyo-cli mcp list
          cargo package --list --allow-dirty -p tomoyo-protocol -p tomoyo-sdk -p tomoyo-wasm-sdk

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for Svelte 5 WebView frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Type-check, test & build Svelte 5 WebView bundles
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Enforce coding standards & anti-bloat hygiene gate
        shell: pwsh
        run: pwsh -File scripts/check_hygiene.ps1

      - name: Setup Rust toolchain (Windows + wasm32 + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugins (example + official DevTools)
        shell: pwsh
        run: |
          cargo build --manifest-path plugins/example-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/example-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_wasm_demo.wasm plugins/example-wasm/plugin.wasm -Force
          cargo build --manifest-path plugins/official-devtools-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/official-devtools-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_devtools.wasm plugins/official-devtools-wasm/plugin.wasm -Force
          cargo test --manifest-path plugins/official-devtools-wasm/Cargo.toml
          cargo build --manifest-path plugins/official-regex-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          Copy-Item plugins/official-regex-wasm/target/wasm32-unknown-unknown/release/tomoyo_plugin_regex.wasm plugins/official-regex-wasm/plugin.wasm -Force
          cargo test --manifest-path plugins/official-regex-wasm/Cargo.toml

      - name: Run Clippy lint gate (zero warnings)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -D warnings"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace unit & integration tests (zero warnings)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -D warnings"
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Enforce release binary size ceilings & zero VCRUNTIME140 DLL dependency
        shell: pwsh
        run: |
          pwsh -File scripts/check_hygiene.ps1 -CheckBinaries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c '
          import glob, struct
          for p in sorted(glob.glob("target/release/tomoyo*.exe")):
              b = open(p, "rb").read()
              pe = struct.unpack_from("<I", b, 0x3C)[0]
              nsec = struct.unpack_from("<H", b, pe + 6)[0]
              opt_sz = struct.unpack_from("<H", b, pe + 20)[0]
              opt = pe + 24
              imp_rva = struct.unpack_from("<I", b, opt + 112 + 8)[0]
              secs = [struct.unpack_from("<IIII", b, opt + opt_sz + i * 40 + 8) for i in range(nsec)]
              rva2off = lambda r: next((r - va + rp for vs, va, rs, rp in secs if va <= r < va + max(vs, rs)), None)
              off, dlls = rva2off(imp_rva), []
              while off is not None:
                  _, _, _, nrva, _ = struct.unpack_from("<IIIII", b, off)
                  if nrva == 0: break
                  no = rva2off(nrva)
                  dlls.append(b[no:b.find(b"\0", no)].decode("ascii", "replace"))
                  off += 20
              bad = [d for d in dlls if "vcruntime" in d.lower() or "msvcp" in d.lower()]
              print(f"{p}: non-crt-static check bad={bad} (imports={len(dlls)})")
              assert not bad, f"{p} still dynamically imports VC++ runtime DLLs: {bad}"
          '

      - name: Run strict anti-leak resource budget & WebView self-tests
        shell: pwsh
        run: |
          $out1 = Join-Path $env:TEMP "tomoyo_ci_st1.txt"
          $out2 = Join-Path $env:TEMP "tomoyo_ci_st2.txt"
          $p1 = Start-Process -FilePath ".\target\release\tomoyo.exe" -ArgumentList "--self-test","--strict-budget" -Wait -PassThru -RedirectStandardOutput $out1 -NoNewWindow
          Get-Content $out1
          if ($p1.ExitCode -ne 0) { exit $p1.ExitCode }
          $p2 = Start-Process -FilePath ".\target\release\tomoyo-webview-host.exe" -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $out2 -NoNewWindow
          Get-Content $out2
          if ($p2.ExitCode -ne 0) { exit $p2.ExitCode }
          $out3 = Join-Path $env:TEMP "tomoyo_ci_st3.txt"
          $p3 = Start-Process -FilePath ".\target\release\tomoyo-capture.exe" -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $out3 -NoNewWindow
          Get-Content $out3
          if ($p3.ExitCode -ne 0) { exit $p3.ExitCode }
          .\target\release\tomoyo-plugin-ocr.exe --self-test
          .\target\release\tomoyo-plugin-translate.exe --self-test
          .\target\release\tomoyo-plugin-capture.exe --self-test
          .\target\release\tomoyo-plugin-clipboard.exe --self-test
          .\target\release\tomoyo-plugin-winlayout.exe --self-test
          .\target\release\tomoyo-plugin-ai.exe --self-test
          .\target\release\tomoyo-cli.exe registry list
          .\target\release\tomoyo-cli.exe registry check --manifest-only
          .\target\release\tomoyo-cli.exe dev plugins/official-notes --query "hello" --once
          .\target\release\tomoyo-cli.exe dev plugins/official-md-editor --query "" --once
          .\target\release\tomoyo-cli.exe dev plugins/official-translate --query "hello" --once
          .\target\release\tomoyo-cli.exe dev plugins/official-capture --query "" --once
          .\target\release\tomoyo-cli.exe dev plugins/official-clipboard --query ":manage" --once
          .\target\release\tomoyo-cli.exe dev plugins/official-winlayout --query "left" --once
          .\target\release\tomoyo-cli.exe dev plugins/official-ai --query "sum hello" --once

  macos-core-check:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test core & macOS UI adapter
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test -p tomoyo-protocol -p tomoyo-core -p tomoyo-everything -p tomoyo-providers -p tomoyo-ui-shared -p tomoyo-ui-macos

  windows-arm64-check:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust toolchain (Windows ARM64)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Verify full workspace builds natively on Windows ARM64
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check --workspace
          cargo test -p tomoyo-protocol -p tomoyo-core

  linux-arm64-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install native Linux ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libcurl4-openssl-dev libsecret-1-dev libx11-dev libxext-dev libxtst-dev libdbus-1-dev libwayland-dev libpipewire-0.3-dev
      - name: Setup Rust toolchain (Linux ARM64)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Verify full workspace builds natively on Linux ARM64
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check --workspace
          cargo test -p tomoyo-protocol -p tomoyo-sdk -p tomoyo-wasm-sdk -p tomoyo-core
